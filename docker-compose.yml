services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=bookstore_dev
      - POSTGRES_PASSWORD=bookstore_dev
      - POSTGRES_DB=bookstore_dev_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookstore_dev -d bookstore_dev_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bookstore_network

  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - ./env.dev
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bookstore_network

volumes:
  postgres_data:

# Rede declarada de forma explícita. O tipo é bridge (o padrão do Docker),
# e os serviços web e db se enxergam pelo nome (ex.: SQL_HOST=db).
networks:
  bookstore_network:
    name: bookstore_network
    driver: bridge
